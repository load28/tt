# TypeScript's `bump release-X.Y`: beta -> rc -> stable -> subsequent patches.
name: Bump Release Version

on:
  workflow_dispatch:
    inputs:
      line:
        description: Release line in X.Y form
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.line }}
  cancel-in-progress: false

jobs:
  bump:
    name: bump release-${{ inputs.line }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-${{ inputs.line }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bump the release version
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          VERSION="$(node npm/scripts/release-bump.mjs "$LINE" "$CURRENT")"
          node npm/scripts/release-version.mjs "$VERSION"
          git add Cargo.toml Cargo.lock npm/tt-lang/package.json packages/create-tt/package.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure git for GitHub App token
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          basic_auth="$(node -e 'process.stdout.write(Buffer.from("x-access-token:" + process.env.GITHUB_APP_TOKEN).toString("base64"))')"
          echo "::add-mask::$basic_auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic_auth}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Commit and push the version
        run: |
          set -euo pipefail
          git commit -m "chore(release): bump version to $VERSION"
          git push origin "HEAD:refs/heads/release-${{ inputs.line }}"

