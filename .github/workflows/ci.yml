# TypeScript-style merge gate. main and release-X.Y are always expected to
# build cleanly. Pushes to those branches also produce immutable release
# artifacts. Scheduled main builds are published as Nightlies; formal releases
# are promoted separately and never rebuilt.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
    branches: [main, "release-*"]
  merge_group:
    branches: [main, "release-*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml decides the version, so nothing here names
        # one. `rustup show active-toolchain` installs it if the runner
        # does not have it and prints which file it came from, so the log
        # says what was used rather than leaving it inferred.
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # tsc + node so the integration tests actually run instead of skipping
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Check agent setup entrypoints
        run: |
          test "$(cat CLAUDE.md)" = "@AGENTS.md"
          grep -Fq './scripts/doctor' AGENTS.md
          bash -n scripts/doctor
          before="$(git status --porcelain)"
          if ./scripts/doctor; then
            echo "doctor unexpectedly accepted an unconfigured checkout" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          test "$(git status --porcelain)" = "$before"

      # `tsc` for the integration tests, which type-check and run ttc's
      # emitted TypeScript. Pinned to major 6 because major 7 *is* the
      # native compiler and takes a different command line; what ttc drives
      # for `--types` is installed separately below.
      - name: Install TypeScript
        run: npm install -g typescript@6

      - name: Install Rolldown for std tree-shaking regression
        run: npm install -g rolldown@1.2.5

      # TypeScript 7 is a dependency of this repository, pinned in
      # package.json: it ships the API client and the native executable
      # together, and ttc resolves both from node_modules the way every
      # consumer project does (src/typescript/toolchain.rs).
      - name: Install TypeScript
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          TTC_REQUIRE_TSGO: "1"
        run: cargo test

      - name: Check the standalone fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Test npm release tooling and project initializer
        run: node --test npm/scripts/*.test.mjs packages/create-tt/test/*.test.mjs

      - name: Install bundler adapter dependencies
        run: npm ci --prefix integrations/unplugin

      - name: Test bundler adapters against ttc
        env:
          TTC_BINARY: ${{ github.workspace }}/target/debug/ttc
        run: npm --prefix integrations/unplugin test

      - name: Build-test a freshly generated project
        env:
          TTC_BINARY: ${{ github.workspace }}/target/debug/ttc
        run: npm --prefix packages/create-tt run test:e2e

      - name: Test deliberation tooling
        run: |
          npm --prefix tools/deliberation-bot test
          npm --prefix tools/deliberation-bot run check

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Type-check and build the website
        working-directory: website
        env:
          SITE_BASE_PATH: /tt/
        run: |
          bun run typecheck
          bun run build

      # A skipped suite is green in every other way, so the suite itself
      # has to go red: `TTC_REQUIRE_TSGO` turns "no toolchain found" from a
      # silent skip into a failure. (It replaced a `grep "N passed"` count,
      # which went stale every time a test was added.)
      - name: Guard — integration tests must not have been skipped
        env:
          TTC_REQUIRE_TSGO: "1"
        run: |
          tsc --version
          node --version
          node -p "require('typescript/package.json').version"
          test -f node_modules/typescript/dist/api/sync/api.js
          cargo test --test native

  bench:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison needs the revision this branch started from, and
          # a shallow clone has no merge base to find.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both revisions are built and measured here, in one job, on one
      # machine: the ratio between them is the only number a shared runner
      # can report honestly (docs/tasks/TASK-225).
      - name: Compare against the merge base
        run: ./scripts/bench-compare

      - name: Record this revision's numbers
        if: always()
        run: cat /tmp/tt-bench-head.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: |
            /tmp/tt-bench-head.json
            /tmp/tt-bench-base.json
          if-no-files-found: warn

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      # The instrumentation lives in the toolchain, not in the crate.
      - name: Install the coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same pinned revision the `native` job builds. Coverage measured
      # without a TypeScript toolchain is six points lower and describes a
      # different program — the editor and backend layers simply do not run
      # — so the number would not be comparable between runs
      # (docs/tasks/TASK-224).
      - name: Install TypeScript
        run: npm ci

      # The floor is the measured baseline, not a target: "do not drop" is
      # a rule that can be followed, while an arbitrary goal invites tests
      # written to move a number. Raising it belongs to the change that
      # earns the higher coverage.
      - name: Measure, and refuse to go below the baseline
        env:
          # A missing toolchain would silently lower the number instead of
          # failing the job, which is the one way this gate could lie.
          TTC_REQUIRE_TSGO: "1"
        run: |
          cargo llvm-cov --workspace --summary-only --fail-under-lines 86.9
          cargo llvm-cov report --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  native:
    name: tsgo type checking + vscode extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml decides the version, so nothing here names
        # one. `rustup show active-toolchain` installs it if the runner
        # does not have it and prints which file it came from, so the log
        # says what was used rather than leaving it inferred.
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: the API client and the `tsgo` executable speak a protocol
      # with no version negotiation, so both have to come from one build —
      # and a floating `main` would break this gate on someone else's
      # commit. Bumping it is a task, not a side effect.
      - name: Install TypeScript
        run: npm ci

      - name: Build ttc
        run: cargo build

      - name: Test — the type checking modes end to end
        env:
          # Nothing here may skip: this job builds the compiler itself.
          TTC_REQUIRE_TSGO: "1"
        run: cargo test --test native

      # The checkout above is also a corpus: TypeScript's own conformance
      # cases and its bundled library declarations. Every file in it that is
      # valid TypeScript has to come back byte-for-byte (docs/tasks/TASK-223).
      # A sample here, the whole thing on the soak schedule.
      - name: Test — real TypeScript comes back unchanged
        env:
          TTC_REQUIRE_CORPUS: "1"
        run: cargo test --test corpus -- --nocapture

      - name: Build the extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile

      - name: Test — the extension against a compiler that can emit
        working-directory: editors/vscode
        run: |
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          node --test "server/out/test/*.test.js" 2>&1 | tee /tmp/extension-native.log
          # Every guard in the suite is satisfiable here — the compiler is
          # on PATH, it can serve a language server, and it can emit
          # declarations — so a skip means the wiring broke.
          grep -q "^# skipped 0$" /tmp/extension-native.log

  release-version:
    name: release artifact version
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      npm_tag: ${{ steps.versions.outputs.npm_tag }}
      unplugin_version: ${{ steps.versions.outputs.unplugin_version }}
      vscode_version: ${{ steps.versions.outputs.vscode_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive one version for every release artifact
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          RUN_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          TIMESTAMP="$(date -u -d "$RUN_CREATED_AT" +%Y%m%d%H%M%S)"
          if [ "$GITHUB_REF_NAME" = main ]; then
            VERSION="$(node npm/scripts/release-artifacts.mjs nightly "$VERSION" "$TIMESTAMP" "$GITHUB_RUN_NUMBER")"
          fi
          EXTENSION_BASE="$(node -p "require('./editors/vscode/package.json').version")"
          UNPLUGIN_BASE="$(node -p "require('./integrations/unplugin/package.json').version.split('-')[0]")"
          node npm/scripts/release-artifacts.mjs describe "$VERSION" "$EXTENSION_BASE" "$UNPLUGIN_BASE" "$TIMESTAMP" >> "$GITHUB_OUTPUT"

  release-build:
    name: release build (${{ matrix.key }})
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    needs: release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { key: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { key: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { key: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { key: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp the artifact version
        shell: bash
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          node npm/scripts/release-version.mjs "$VERSION"
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-ttc-${{ matrix.key }}
          path: target/${{ matrix.target }}/release/ttc${{ matrix.key == 'win32-x64' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 30

  release-vsix:
    name: release VSIX
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    needs: release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive artifact versions
        id: versions
        run: |
          echo "version=${{ needs.release-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "vscode_version=${{ needs.release-version.outputs.vscode_version }}" >> "$GITHUB_OUTPUT"
      - name: Package extension
        working-directory: editors/vscode
        run: |
          npm ci
          node ../../npm/scripts/stamp-version.mjs "${{ steps.versions.outputs.version }}" --vscode-version "${{ steps.versions.outputs.vscode_version }}"
          npm run grammar:check
          npm run compile
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out "../../tt-language-${{ steps.versions.outputs.vscode_version }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: tt-language-${{ steps.versions.outputs.vscode_version }}.vsix
          if-no-files-found: error
          retention-days: 30

  release-ts-preview:
    name: release TypeScript preview VSIX
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The editor counterpart of the pinned TypeScript nightly: the same
      # commit's vscode extension under tt's own identity, one VSIX per
      # platform, with the platform package's tsgo bundled (TASK-258).
      - name: Build the pinned TypeScript preview extension
        run: node npm/scripts/build-ts-preview-vsix.mjs ts-preview
      - uses: actions/upload-artifact@v4
        with:
          name: release-ts-preview
          path: ts-preview/*.vsix
          if-no-files-found: error
          retention-days: 30

  release-metadata:
    name: releasable artifact
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))
    needs: [check, bench, coverage, native, release-version, release-build, release-vsix, release-ts-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write immutable release metadata
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
          NPM_TAG: ${{ needs.release-version.outputs.npm_tag }}
          UNPLUGIN_VERSION: ${{ needs.release-version.outputs.unplugin_version }}
          VSCODE_VERSION: ${{ needs.release-version.outputs.vscode_version }}
        run: |
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceBranch "$GITHUB_REF_NAME" \
            --arg version "$VERSION" \
            --arg npmTag "$NPM_TAG" \
            --arg unpluginVersion "$UNPLUGIN_VERSION" \
            --arg vscodeVersion "$VSCODE_VERSION" \
            '{sourceSha:$sourceSha,sourceBranch:$sourceBranch,version:$version,npmTag:$npmTag,unpluginVersion:$unpluginVersion,vscodeVersion:$vscodeVersion}' \
            > release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 30
