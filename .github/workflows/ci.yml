name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml decides the version, so nothing here names
        # one. `rustup show active-toolchain` installs it if the runner
        # does not have it and prints which file it came from, so the log
        # says what was used rather than leaving it inferred.
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # tsc + node so the integration tests actually run instead of skipping
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check agent setup entrypoints
        run: |
          test "$(cat CLAUDE.md)" = "@AGENTS.md"
          grep -Fq './scripts/doctor' AGENTS.md
          bash -n scripts/doctor
          before="$(git status --porcelain)"
          if ./scripts/doctor; then
            echo "doctor unexpectedly accepted an unconfigured checkout" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          test "$(git status --porcelain)" = "$before"

      # `tsc` for the integration tests, which type-check and run ttc's
      # emitted TypeScript. Pinned to major 6 because major 7 *is* the
      # native compiler and takes a different command line; what ttc drives
      # for `--types` is installed separately below.
      - name: Install TypeScript
        run: npm install -g typescript@6

      - name: Install Rolldown for std tree-shaking regression
        run: npm install -g rolldown@1.2.5

      # What `--check-types`/`--types` drive: TypeScript 7's own compiler,
      # through its API client. Without one the `tests/native.rs` suite
      # skips silently, so the gate installs it and points ttc at it.
      - name: Install TypeScript 7 for the type checking modes
        run: |
          mkdir -p "$HOME/ts7" && cd "$HOME/ts7"
          npm install --no-save typescript@7
          echo "TTC_TSGO_API=$HOME/ts7/node_modules/typescript/dist/api/sync/api.js" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Test npm release tooling and project initializer
        run: node --test npm/scripts/*.test.mjs packages/create-tt/test/*.test.mjs

      # A skipped suite is green in every other way, so the suite itself
      # has to go red: `TTC_REQUIRE_TSGO` turns "no toolchain found" from a
      # silent skip into a failure. (It replaced a `grep "N passed"` count,
      # which went stale every time a test was added.)
      - name: Guard — integration tests must not have been skipped
        env:
          TTC_REQUIRE_TSGO: "1"
        run: |
          tsc --version
          node --version
          # The native suite needs a TypeScript 7 API client to check
          # against; declaration emit needs more than a release has, and is
          # covered by the `native` job below.
          test -f "$TTC_TSGO_API"
          cargo test --test native

  bench:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison needs the revision this branch started from, and
          # a shallow clone has no merge base to find.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both revisions are built and measured here, in one job, on one
      # machine: the ratio between them is the only number a shared runner
      # can report honestly (docs/tasks/TASK-225).
      - name: Compare against the merge base
        run: ./scripts/bench-compare

      - name: Record this revision's numbers
        if: always()
        run: cat /tmp/tt-bench-head.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: |
            /tmp/tt-bench-head.json
            /tmp/tt-bench-base.json
          if-no-files-found: warn

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      # The instrumentation lives in the toolchain, not in the crate.
      - name: Install the coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same pinned revision the `native` job builds. Coverage measured
      # without a TypeScript toolchain is six points lower and describes a
      # different program — the editor and backend layers simply do not run
      # — so the number would not be comparable between runs
      # (docs/tasks/TASK-224).
      - name: Check out typescript-go
        uses: actions/checkout@v4
        with:
          repository: microsoft/typescript-go
          ref: c6b013f5706d58582f566df778cc0df2683b58f5
          path: typescript-go

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: typescript-go/go.mod
          cache-dependency-path: typescript-go/go.sum

      - name: Build the compiler and its API client
        working-directory: typescript-go
        run: |
          go build -o built/local/tsgo ./cmd/tsgo
          npm ci
          npx tsc -b _packages/native-preview

      # The floor is the measured baseline, not a target: "do not drop" is
      # a rule that can be followed, while an arbitrary goal invites tests
      # written to move a number. Raising it belongs to the change that
      # earns the higher coverage.
      - name: Measure, and refuse to go below the baseline
        env:
          TTC_TSGO_ROOT: ${{ github.workspace }}/typescript-go
          # A missing toolchain would silently lower the number instead of
          # failing the job, which is the one way this gate could lie.
          TTC_REQUIRE_TSGO: "1"
        run: |
          cargo llvm-cov --workspace --summary-only --fail-under-lines 86.8
          cargo llvm-cov report --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  extension:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml decides the version, so nothing here names
        # one. `rustup show active-toolchain` installs it if the runner
        # does not have it and prints which file it came from, so the log
        # says what was used rather than leaving it inferred.
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The server tests drive the real compiler; without it on PATH they
      # skip, and the guard below would pass on nothing.
      - name: Build ttc
        run: cargo build

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci

      # Every TypeScript answer the server gives comes from the compiler's
      # own language server, so the tests that ask for one skip without a
      # `tsgo` on hand. It goes in the repository root rather than beside
      # the extension: the extension's resolution walks `node_modules` up
      # from the workspace, and `editors/vscode/node_modules/typescript` is
      # the TypeScript 5 that *builds* the extension.
      - name: Install TypeScript 7 for the language server
        run: npm install --no-save --no-package-lock typescript@7

      - name: Build
        working-directory: editors/vscode
        run: npx tsc -b

      - name: Test
        working-directory: editors/vscode
        run: |
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          node --test "server/out/test/*.test.js" 2>&1 | tee /tmp/extension.log

      # A skip here is not a pass: these tests skip silently when a tool is
      # missing, which is exactly what this job installs. The one skip a
      # released TypeScript 7 cannot avoid is declaration emit, which the
      # package does not expose — the `native` job builds a compiler that
      # does and runs the whole suite with nothing skipped.
      - name: Guard — nothing skipped for a tool this job installed
        run: |
          ! grep -q "SKIP ttc not on PATH" /tmp/extension.log
          ! grep -q "SKIP no tsgo executable" /tmp/extension.log

  native:
    name: type checking (typescript-go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml decides the version, so nothing here names
        # one. `rustup show active-toolchain` installs it if the runner
        # does not have it and prints which file it came from, so the log
        # says what was used rather than leaving it inferred.
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: the API client and the `tsgo` executable speak a protocol
      # with no version negotiation, so both have to come from one build —
      # and a floating `main` would break this gate on someone else's
      # commit. Bumping it is a task, not a side effect.
      - name: Check out typescript-go
        uses: actions/checkout@v4
        with:
          repository: microsoft/typescript-go
          ref: c6b013f5706d58582f566df778cc0df2683b58f5
          path: typescript-go

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: typescript-go/go.mod
          cache-dependency-path: typescript-go/go.sum

      - name: Build the compiler and its API client
        working-directory: typescript-go
        run: |
          go build -o built/local/tsgo ./cmd/tsgo
          npm ci
          npx tsc -b _packages/native-preview

      - name: Build ttc
        run: cargo build

      - name: Test — the type checking modes end to end
        env:
          TTC_TSGO_ROOT: ${{ github.workspace }}/typescript-go
          # Nothing here may skip: this job builds the compiler itself.
          TTC_REQUIRE_TSGO: "1"
        run: cargo test --test native

      - name: Build the extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc -b

      - name: Test — the extension against a compiler that can emit
        working-directory: editors/vscode
        env:
          TTC_TSGO_ROOT: ${{ github.workspace }}/typescript-go
        run: |
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          node --test "server/out/test/*.test.js" 2>&1 | tee /tmp/extension-native.log
          # Every guard in the suite is satisfiable here — the compiler is
          # on PATH, it can serve a language server, and it can emit
          # declarations — so a skip means the wiring broke.
          grep -q "^# skipped 0$" /tmp/extension-native.log
