# Human approval is the manual dispatch of this workflow. It only publishes an
# exact release-branch SHA that Prepare Dev Release marked successful.
name: Approve & Publish Dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional X.Y.Z core (required when multiple Dev branches are pending)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  statuses: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  approve:
    name: verify prepared branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      branch: ${{ steps.release.outputs.branch }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      prepare_run_id: ${{ steps.release.outputs.prepare_run_id }}
      unplugin_version: ${{ steps.release.outputs.unplugin_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*' --prune
      - name: Verify the exact SHA passed preparation
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node npm/scripts/release-plan.mjs approve-dev "$REQUESTED_VERSION" > /tmp/release-plan.json
          VERSION="$(jq -r .version /tmp/release-plan.json)"
          BRANCH="$(jq -r .branch /tmp/release-plan.json)"
          SOURCE_SHA="$(jq -r .sourceSha /tmp/release-plan.json)"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status" > /tmp/statuses.json
          jq -e '[.statuses[] | select(.context == "release/dev-prepare" and .state == "success")] | first' \
            /tmp/statuses.json > /tmp/ready-status.json
          RUN_URL="$(jq -r .target_url /tmp/ready-status.json)"
          case "$RUN_URL" in
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"*) ;;
            *) echo "invalid preparation run URL: $RUN_URL" >&2; exit 1 ;;
          esac
          RUN_ID="${RUN_URL##*/}"
          git checkout --detach "$SOURCE_SHA"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$VERSION"
          TIMESTAMP="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
          EXTENSION_BASE="$(node -p "require('./editors/vscode/package.json').version")"
          UNPLUGIN_BASE="$(node -p "require('./integrations/unplugin/package.json').version.split('-')[0]")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prepare_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          node npm/scripts/dev-versions.mjs "$VERSION" "$EXTENSION_BASE" "$UNPLUGIN_BASE" "$TIMESTAMP" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: publish npm development packages
    needs: approve
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.approve.outputs.version }}
      UNPLUGIN_VERSION: ${{ needs.approve.outputs.unplugin_version }}
      SOURCE_SHA: ${{ needs.approve.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.approve.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Download prepared binaries
        run: gh run download "${{ needs.approve.outputs.prepare_run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'dev-ttc-*' --dir binaries
      - name: Assemble and stamp packages
        run: |
          mkdir -p dist/packages
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            exe=ttc; [ "$key" = win32-x64 ] && exe=ttc.exe
            node npm/scripts/make-platform-package.mjs "$key" "binaries/dev-ttc-$key/$exe" dist/packages "$VERSION"
          done
          node npm/scripts/stamp-version.mjs "$VERSION" --unplugin-version "$UNPLUGIN_VERSION"
      - name: Smoke-test linux-x64 package
        run: |
          dist/packages/@load28/tt-lang-linux-x64/bin/ttc --version
          printf 'enum E { A(x: number) }\nconst v = E.A(1);\n' > /tmp/dev-smoke.tt
          dist/packages/@load28/tt-lang-linux-x64/bin/ttc -p /tmp/dev-smoke.tt | grep -q 'kind: "A"'
      - name: Publish packages unless the immutable version exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_dev() {
            package_dir="$1"
            name="$(node -p "require('./$package_dir/package.json').name")"
            version="$(node -p "require('./$package_dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              git_head="$(npm view "$name@$version" gitHead)"
              if [ -n "$git_head" ] && [ "$git_head" != "$SOURCE_SHA" ]; then
                echo "$name@$version was published from $git_head, not $SOURCE_SHA" >&2
                exit 1
              fi
              echo "$name@$version already exists"
            else
              npm publish "./$package_dir" --tag dev --provenance --access public
            fi
          }
          for package_dir in dist/packages/@load28/tt-lang-*; do publish_dev "$package_dir"; done
          publish_dev npm/tt-lang
          publish_dev integrations/unplugin
          publish_dev packages/create-tt

  publish-vsix:
    name: publish VSIX GitHub pre-release
    needs: [approve, publish-npm]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download prepared VSIX
        run: gh run download "${{ needs.approve.outputs.prepare_run_id }}" --repo "$GITHUB_REPOSITORY" --name dev-vsix --dir vsix
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v${{ needs.approve.outputs.version }}
          target_commitish: ${{ needs.approve.outputs.source_sha }}
          name: tt dev ${{ needs.approve.outputs.version }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: vsix/*.vsix
          body: Development build from `${{ needs.approve.outputs.source_sha }}`.

  cleanup:
    name: remove completed release branch
    needs: [approve, publish-vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete "${{ needs.approve.outputs.branch }}"
