# Promotion of one successful CI artifact set. Scheduled main CI runs promote
# Nightlies automatically; successful release branch CI runs wait for the
# production environment approval. Neither path compiles source again.
name: Publish Release
run-name: Publish ${{ github.event.workflow_run.head_branch }} from CI ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  verify:
    name: verify promoted CI build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (((github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'release-')))
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.release.outputs.run_id }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_branch: ${{ steps.release.outputs.source_branch }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      unplugin_version: ${{ steps.release.outputs.unplugin_version }}
      vscode_version: ${{ steps.release.outputs.vscode_version }}
      environment_name: ${{ steps.release.outputs.environment_name }}
      run_event: ${{ steps.release.outputs.run_event }}
    steps:
      - name: Download and verify metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,status,conclusion,event,headSha,headBranch > /tmp/run.json
          test "$(jq -r .name /tmp/run.json)" = CI
          test "$(jq -r .status /tmp/run.json)" = completed
          test "$(jq -r .conclusion /tmp/run.json)" = success
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir metadata
          SOURCE_SHA="$(jq -r .sourceSha metadata/release-metadata.json)"
          SOURCE_BRANCH="$(jq -r .sourceBranch metadata/release-metadata.json)"
          VERSION="$(jq -r .version metadata/release-metadata.json)"
          NPM_TAG="$(jq -r .npmTag metadata/release-metadata.json)"
          RUN_EVENT="$(jq -r .event /tmp/run.json)"
          test "$SOURCE_SHA" = "$(jq -r .headSha /tmp/run.json)"
          test "$SOURCE_BRANCH" = "$(jq -r .headBranch /tmp/run.json)"
          if [ "$SOURCE_BRANCH" = main ]; then
            case "$RUN_EVENT" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
            test "$NPM_TAG" = next
            ENVIRONMENT_NAME=nightly
          else
            test "$RUN_EVENT" = push
            case "$SOURCE_BRANCH" in release-*) ;; *) exit 1 ;; esac
            case "$VERSION" in
              *-beta) EXPECTED_TAG=beta ;;
              *-rc) EXPECTED_TAG=rc ;;
              *-dev.*) exit 1 ;;
              *) EXPECTED_TAG=latest ;;
            esac
            test "$NPM_TAG" = "$EXPECTED_TAG"
            ENVIRONMENT_NAME=production
          fi
          if [ "$NPM_TAG" = next ]; then
            test "$SOURCE_BRANCH" = main
          else
            case "$SOURCE_BRANCH" in release-*) ;; *) exit 1 ;; esac
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "unplugin_version=$(jq -r .unpluginVersion metadata/release-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "vscode_version=$(jq -r .vscodeVersion metadata/release-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "environment_name=$ENVIRONMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "run_event=$RUN_EVENT" >> "$GITHUB_OUTPUT"

  publish:
    name: publish verified artifacts
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.verify.outputs.environment_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ needs.verify.outputs.run_id }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      SOURCE_BRANCH: ${{ needs.verify.outputs.source_branch }}
      RUN_EVENT: ${{ needs.verify.outputs.run_event }}
      VERSION: ${{ needs.verify.outputs.version }}
      NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
      UNPLUGIN_VERSION: ${{ needs.verify.outputs.unplugin_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Reject a superseded build
        run: |
          set -euo pipefail
          latest_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$SOURCE_BRANCH" --event "$RUN_EVENT" --limit 1 --json databaseId --jq '.[0].databaseId')"
          test "$RUN_ID" = "$latest_run_id"
      - name: Download the promoted build
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'release-ttc-*' --dir binaries
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-vsix --dir vsix
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-ts-preview --dir ts-preview
      - name: Assemble packages and release archives
        run: |
          mkdir -p dist/packages dist/assets
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            exe=ttc; [ "$key" = win32-x64 ] && exe=ttc.exe
            package_dir="$(node npm/scripts/make-platform-package.mjs "$key" "binaries/release-ttc-$key/$exe" dist/packages "$VERSION")"
            if [ "$key" = win32-x64 ]; then
              (cd "$package_dir/bin" && zip -q "$OLDPWD/dist/assets/ttc-v$VERSION-$key.zip" "$exe")
            else
              tar -C "$package_dir/bin" -czf "dist/assets/ttc-v$VERSION-$key.tar.gz" "$exe"
            fi
          done
          node npm/scripts/stamp-version.mjs "$VERSION" --unplugin-version "$UNPLUGIN_VERSION"
      - name: Smoke-test the promoted compiler
        run: |
          test "$(dist/packages/@openload28/tt-lang-linux-x64/bin/ttc --version)" = "$VERSION"
          printf 'variant E { A(x: number) }\nconst v = E.A(1);\n' > /tmp/release-smoke.tt
          dist/packages/@openload28/tt-lang-linux-x64/bin/ttc -p /tmp/release-smoke.tt | grep -q 'kind: "A"'
      - name: Publish immutable npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_package() {
            package_dir="$1"
            mode="${2:-release}"
            name="$(node -p "require('./$package_dir/package.json').name")"
            version="$(node -p "require('./$package_dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              git_head="$(npm view "$name@$version" gitHead)"
              if [ "$mode" = release ]; then
                test -z "$git_head" || test "$git_head" = "$SOURCE_SHA"
              fi
              echo "$name@$version already exists"
            else
              npm publish "./$package_dir" --tag "$NPM_TAG" --provenance --access public
            fi
          }
          for package_dir in dist/packages/@openload28/tt-lang-*; do publish_package "$package_dir"; done
          publish_package npm/tt-lang
          publish_package integrations/unplugin independent
          publish_package packages/create-tt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.npm_tag == 'next' && format('next-v{0}', needs.verify.outputs.version) || format('v{0}', needs.verify.outputs.version) }}
          target_commitish: ${{ needs.verify.outputs.source_sha }}
          name: tt ${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.npm_tag != 'latest' }}
          make_latest: ${{ needs.verify.outputs.npm_tag == 'latest' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/assets/*
            vsix/*.vsix
            ts-preview/*.vsix
