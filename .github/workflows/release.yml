# Prepare a stable release from a successful Dev tag without changing main.
name: Prepare Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional X.Y.Z to promote (empty selects latest unpromoted Dev)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: select Dev and prepare stable branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      branch: ${{ steps.release.outputs.branch }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*' --prune
      - name: Create or resume the release branch
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node npm/scripts/release-plan.mjs prod "$REQUESTED_VERSION" > /tmp/release-plan.json
          VERSION="$(jq -r .version /tmp/release-plan.json)"
          BRANCH="$(jq -r .branch /tmp/release-plan.json)"
          SOURCE_SHA="$(jq -r .sourceSha /tmp/release-plan.json)"
          RESUME="$(jq -r .resume /tmp/release-plan.json)"
          if ! git merge-base --is-ancestor origin/main "$SOURCE_SHA"; then
            echo "main advanced after the selected Dev release; prepare and publish a new Dev first" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$RESUME" = true ]; then
            git checkout -B "$BRANCH" "$SOURCE_SHA"
            test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$VERSION"
          else
            git checkout -b "$BRANCH" "$SOURCE_SHA"
            node npm/scripts/release-version.mjs "$VERSION"
            git add Cargo.toml Cargo.lock npm/tt-lang/package.json packages/create-tt/package.json
            git commit -m "chore(release): $VERSION"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: fmt / clippy / test with tsgo
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/typescript-go
          ref: c6b013f5706d58582f566df778cc0df2683b58f5
          path: typescript-go
      - uses: actions/setup-go@v5
        with:
          go-version-file: typescript-go/go.mod
          cache-dependency-path: typescript-go/go.sum
      - name: Build tsgo and its API client
        working-directory: typescript-go
        run: |
          go build -o built/local/tsgo ./cmd/tsgo
          npm ci
          npx tsc -b _packages/native-preview
      - run: npm install -g typescript@6 rolldown@1.2.5
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test with the directly built tsgo
        env:
          TTC_TSGO_ROOT: ${{ github.workspace }}/typescript-go
          TTC_REQUIRE_TSGO: "1"
        run: cargo test
      - run: node --test npm/scripts/*.test.mjs packages/create-tt/test/*.test.mjs

  build:
    name: build ${{ matrix.key }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { key: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { key: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { key: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { key: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ttc-${{ matrix.key }}
          path: target/${{ matrix.target }}/release/ttc${{ matrix.key == 'win32-x64' && '.exe' || '' }}
          if-no-files-found: error

  ready:
    name: mark branch ready for approval
    needs: [prepare, check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Record the exact successful SHA and artifact run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success \
            -f context=release/prod-prepare \
            -f description="Production $VERSION is ready to publish" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Open the Production release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json number --jq length)" = 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): $VERSION" \
              --body "Production release prepared from \`$SOURCE_SHA\`. Merging this PR approves and publishes \`$VERSION\`."
          else
            echo "an open Production PR already exists for $BRANCH"
          fi
