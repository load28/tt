# Release — build prebuilt ttc binaries and publish the npm packages.
#
# Trigger: a stable Cargo.toml version bump on main after CI, or a matching
# `vX.Y.Z` tag. Publishing needs the NPM_TOKEN
# repository secret (an npm automation token with publish rights to the
# @load28 scope).
#
# Pipeline: classify/verify Cargo.toml version → build 5 targets → assemble npm
# platform packages + stamp versions → publish (platform packages first,
# then tt-lang and create-tt, so neither points at missing dependencies) →
# GitHub Release with binary archives.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm --provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: detect production version bump
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect and verify production version
        id: version
        shell: bash
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            PREVIOUS_VERSION="$(git show HEAD^:Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)"
            CHANNEL="$(node npm/scripts/release-channel.mjs "$PREVIOUS_VERSION" "$CARGO_VERSION")"
            if [ "$CHANNEL" != "production" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "release channel is $CHANNEL; no production release"
              exit 0
            fi
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG_VERSION / Cargo.toml: $CARGO_VERSION"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
              exit 1
            fi
            node npm/scripts/release-channel.mjs --production "$CARGO_VERSION" >/dev/null
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.key }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - key: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - key: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - key: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - key: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install target for pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # Static musl binaries run on every Linux distro regardless of libc;
      # musl-gcc compiles the one C/asm dependency (psm, via stacker).
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ttc-${{ matrix.key }}
          path: target/${{ matrix.target }}/release/ttc${{ matrix.key == 'win32-x64' && '.exe' || '' }}
          if-no-files-found: error

  publish:
    name: publish npm packages + GitHub Release
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Assemble platform packages
        run: |
          mkdir -p dist/packages dist/assets
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            exe=ttc; [ "$key" = "win32-x64" ] && exe=ttc.exe
            package_dir="$(node npm/scripts/make-platform-package.mjs \
              "$key" "binaries/ttc-$key/$exe" dist/packages "$VERSION")"
            # Release archive alongside the npm package.
            if [ "$key" = "win32-x64" ]; then
              (cd "$package_dir/bin" && zip -q "$OLDPWD/dist/assets/ttc-v$VERSION-$key.zip" "$exe")
            else
              tar -C "$package_dir/bin" -czf "dist/assets/ttc-v$VERSION-$key.tar.gz" "$exe"
            fi
          done

      - name: Smoke-test the linux-x64 binary
        run: |
          dist/packages/@load28/tt-lang-linux-x64/bin/ttc --version
          # A tt-only enum (fields), so the output proves actual compilation
          # rather than TS passthrough.
          printf 'enum E { A(x: number) }\nconst v = E.A(1);\n' > /tmp/smoke.tt
          dist/packages/@load28/tt-lang-linux-x64/bin/ttc -p /tmp/smoke.tt | grep -q 'kind: "A"'

      - name: Stamp version into tt-lang
        run: node npm/scripts/stamp-version.mjs "$VERSION"

      # Platform packages first: the main package's optionalDependencies
      # must be resolvable the moment tt-lang@VERSION appears.
      - name: Publish platform packages
        run: |
          for package_dir in dist/packages/@load28/tt-lang-*; do
            npm publish "$package_dir" --provenance --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish tt-lang
        run: npm publish ./npm/tt-lang --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # unplugin-tt has an independent version. Publish it only when that
      # exact version is not already present, so compiler-only releases do
      # not try to overwrite an immutable npm version.
      - name: Publish unplugin-tt when needed
        run: |
          UNPLUGIN_VERSION="$(node -p "require('./integrations/unplugin/package.json').version")"
          if npm view "@load28/unplugin-tt@$UNPLUGIN_VERSION" version >/dev/null 2>&1; then
            echo "@load28/unplugin-tt@$UNPLUGIN_VERSION is already published"
          else
            npm publish ./integrations/unplugin --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-tt
        run: npm publish ./packages/create-tt --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ needs.verify.outputs.source_sha }}
          files: dist/assets/*
          generate_release_notes: true
