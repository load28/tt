# A simplified TypeScript-style release line without a Beta stage.
# The release-X.Y branch is retained for RC, Stable, and later patches.
name: Advance Release Branch

on:
  workflow_dispatch:
    inputs:
      line:
        description: Release line in X.Y form
        required: true
        type: string
      stage:
        description: Stage to prepare
        required: true
        type: choice
        options: [rc, stable, patch]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.line }}
  cancel-in-progress: false

jobs:
  advance:
    name: ${{ inputs.stage }} release-${{ inputs.line }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create or advance the release line
        env:
          LINE: ${{ inputs.line }}
          STAGE: ${{ inputs.stage }}
        run: |
          BRANCH="release-$LINE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STAGE" = rc ]; then
            if git ls-remote --exit-code origin "refs/heads/$BRANCH"; then
              echo "$BRANCH already exists" >&2
              exit 1
            fi
            git checkout -b "$BRANCH" origin/main
            CURRENT=""
          else
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            CURRENT="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          VERSION="$(node npm/scripts/release-stage.mjs "$STAGE" "$LINE" "$CURRENT")"
          node npm/scripts/release-version.mjs "$VERSION"
          git add Cargo.toml Cargo.lock npm/tt-lang/package.json packages/create-tt/package.json
          git commit -m "chore(release): $VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Prepared $VERSION on $BRANCH. CI will build the exact pushed commit."
