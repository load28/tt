# A simplified TypeScript-style release line without a Beta stage.
# The release-X.Y branch is retained for RC, Stable, and later patches.
name: Advance Release Branch

on:
  workflow_dispatch:
    inputs:
      line:
        description: Release line in X.Y form
        required: true
        type: string
      stage:
        description: Stage to prepare
        required: true
        type: choice
        options: [rc, stable, patch]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.line }}
  cancel-in-progress: false

jobs:
  advance:
    name: ${{ inputs.stage }} release-${{ inputs.line }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create or advance the release line
        env:
          LINE: ${{ inputs.line }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          BRANCH="release-$LINE"
          if [ "$STAGE" = rc ]; then
            if git ls-remote --exit-code origin "refs/heads/$BRANCH"; then
              echo "$BRANCH already exists" >&2
              exit 1
            fi
            git checkout -b "$BRANCH" origin/main
            CURRENT=""
          else
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            CURRENT="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          VERSION="$(node npm/scripts/release-stage.mjs "$STAGE" "$LINE" "$CURRENT")"
          node npm/scripts/release-version.mjs "$VERSION"
          git add Cargo.toml Cargo.lock npm/tt-lang/package.json packages/create-tt/package.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Configure git for GitHub App token
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          basic_auth="$(node -e 'process.stdout.write(Buffer.from("x-access-token:" + process.env.GITHUB_APP_TOKEN).toString("base64"))')"
          echo "::add-mask::$basic_auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic_auth}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Commit and push the release version
        run: |
          set -euo pipefail
          git commit -m "chore(release): $VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Prepared $VERSION on $BRANCH. Its GitHub App push starts CI automatically."
