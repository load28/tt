# The gates that look for bugs rather than confirming known answers: the
# whole corpus, and the two fuzz targets (docs/tasks/TASK-223).
#
# The long runs are manual — this repository is on the free plan, and a
# weekly full differential plus two quarter-hour fuzzers is real money for a
# yield nobody can predict. Dispatch them when a change deserves it: the
# parser, the scanner, codegen, or anything else that decides what tt claims.
#
# Locally, without spending anything:
#
#     TTC_CORPUS_FULL=1 TTC_REQUIRE_CORPUS=1 cargo test --test corpus --release
#     node scripts/fuzz-seed-corpus
#     cd fuzz && cargo +nightly fuzz run compile_any_bytes corpus/compile_any_bytes regressions/compile_any_bytes -- -max_total_time=900
#     cd fuzz && cargo +nightly fuzz run generated_tt_compiles -- -max_total_time=900
#
# The schedule runs each fuzz target for two minutes a night, seeded from
# the case corpus and the committed crash inputs (docs/tasks/TASK-637). It is
# a workflow of its own so that a finding, which depends on luck, never
# decides whether CI's scheduled run publishes a Nightly.
#
# The exhaustive sweeps and the TypeScript parity run every night here too.
# Pull requests run fixed samples of the same suites; the whole sets are a
# search for what the samples missed, not a gate on the Nightly (TASK-808).
name: Soak

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds to run each fuzz target"
        default: "900"

jobs:
  corpus:
    name: differential — the whole corpus
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The corpus is this repository's own TypeScript plus the standard
      # library declarations inside the installed TypeScript package, so
      # the install is what makes the run whole rather than a thin sample.
      # Pinned for the same reason the type-checking job pins it: a
      # floating version would break this gate on someone else's commit.
      - name: Install TypeScript
        run: npm ci

      - name: Every file, not a sample
        env:
          TTC_CORPUS_FULL: "1"
          TTC_REQUIRE_CORPUS: "1"
        run: cargo test --test corpus --release -- --nocapture

  fuzz:
    name: fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [compile_any_bytes, generated_tt_compiles]
    steps:
      - uses: actions/checkout@v4

      # libFuzzer's instrumentation is a nightly flag, which is why the
      # fuzzers are a package of their own — the repository's pinned stable
      # toolchain stays the one every other gate runs on.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seed the corpus from the case files
        run: node scripts/fuzz-seed-corpus

      - name: Fuzz
        working-directory: fuzz
        run: |
          dirs="corpus/${{ matrix.target }}"
          mkdir -p "$dirs"
          if [ -d "regressions/${{ matrix.target }}" ]; then dirs="$dirs regressions/${{ matrix.target }}"; fi
          cargo +nightly fuzz run ${{ matrix.target }} $dirs -- \
            -max_total_time=${{ github.event.inputs.fuzz_seconds || 120 }} \
            -rss_limit_mb=4096

      # A crash is a file. Without this the run says "failed" and the input
      # that caused it is gone with the runner.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  exhaustive:
    name: exhaustive regression sweeps (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript
        run: npm ci

      - name: Every deletion and every prefix of the case corpus
        env:
          TT_MUTATIONS: all
        run: cargo test --release --test fuzz_regressions -- --nocapture

      - name: Every edit sequence answers as a fresh project
        env:
          TTC_REQUIRE_TSGO: "1"
          TT_INCREMENTAL: all
        run: cargo test --release --test incremental -- --nocapture

      - name: Fetch TypeScript's test cases at the pinned commit
        run: scripts/fetch-typescript-cases

      - name: Every TypeScript test case comes back unchanged
        env:
          TTC_REQUIRE_TSGO: "1"
          TTC_REQUIRE_TYPESCRIPT_CASES: "1"
          TTC_TYPESCRIPT_CASES: all
        run: cargo test --release --test corpus typescript_test_cases -- --nocapture

      - name: Every generated matrix case runs against its twin, and every diagnostics case reports its code at its range
        env:
          TTC_REQUIRE_TSGO: "1"
          TT_MATRIX_CASES: all
        run: cargo test --release --test case_baselines -- --nocapture

      - name: Build the extension's language server
        run: |
          npm ci --prefix editors/vscode
          npm --prefix editors/vscode run compile

      - name: Every generated editor matrix case answers as its twin
        env:
          TTC_REQUIRE_TSGO: "1"
          TT_REQUIRE_EXTENSION: "1"
          TT_MATRIX_CASES: all
        run: cargo test --release --test editor_cases -- --nocapture

  typescript-parity:
    name: TypeScript's own tests through the typed check and the editor (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript
        run: npm ci

      - name: Fetch TypeScript's tests at the pinned commit
        run: scripts/fetch-typescript-cases

      - name: Every TypeScript test case type-checks as the pinned tsc does
        env:
          TTC_REQUIRE_TSGO: "1"
          TTC_REQUIRE_TYPESCRIPT_CASES: "1"
          TTC_TYPED_CASES: all
        run: cargo test --release --test corpus typescript_cases_type_check -- --nocapture

      - name: Every TypeScript fourslash test answers as tsgo --lsp does
        env:
          TTC_REQUIRE_TSGO: "1"
          TTC_REQUIRE_TYPESCRIPT_CASES: "1"
          TT_FOURSLASH: all
        run: cargo test --release --test editor_cases typescript_fourslash -- --nocapture
