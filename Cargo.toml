[package]
name = "ttc"
version = "1.0.0-beta"
edition = "2024"
rust-version = "1.98"
description = "Compiler for tt — a tiny TypeScript preprocessor adding Rust-style variants and match expressions on top of 100%-compatible TypeScript."
license = "MIT"
repository = "https://github.com/load28/tt"
readme = "README.md"
keywords = ["typescript", "compiler", "preprocessor", "tagged-union", "pattern-matching"]
categories = ["compilers", "development-tools"]

[dependencies]
swc_common = "26.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_visit = { version = "29.0.0", features = ["path"] }
serde_json = "1.0"

# The ruler for compile time and editor latency (`docs/tasks/TASK-225`).
# `harness = false`: the bench reports its own noise, which is the number a
# regression threshold has to be set from, and no measurement framework
# offers that without becoming the largest dependency in the tree.
[[bench]]
name = "compile"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
